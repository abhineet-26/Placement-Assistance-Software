databases:
  - name: placement_db
    databaseName: placement_db
    user: placement_user
    plan: free

services:
  - type: web
    name: placement_api
    plan: free
    env: python
    rootDir: api
    buildCommand: "./render-build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: placement_db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: web
    name: placement_web
    env: static
    rootDir: web
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: placement_api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
